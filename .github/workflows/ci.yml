name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  python-and-web:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository without marketplace actions
        shell: bash
        run: |
          git init .
          git remote add origin "https://github.com/${GITHUB_REPOSITORY}.git"
          git fetch --depth=1 origin "${GITHUB_SHA}"
          git checkout --detach FETCH_HEAD
      - name: Verify bundled runtimes
        run: |
          python3 --version
          node --version
      - name: Create Python environment
        run: |
          python3 -m venv .venv
          . .venv/bin/activate
          python -m pip install --upgrade pip
          python -m pip install -e '.[dev]'
      - name: Python tests
        run: |
          . .venv/bin/activate
          python -m pytest -q
      - name: Browser-core tests
        run: node --test tests/web/*.test.mjs
      - name: Rebuild standalone artifacts
        run: |
          . .venv/bin/activate
          python tools/build_standalone.py
      - name: Release consistency
        run: |
          . .venv/bin/activate
          python tools/check_consistency.py
      - name: Generated files are committed
        run: git diff --exit-code -- CardTruth.html services/api/static/index.html apps/ios/CardTruth/Resources/CardTruth.html
      - name: Source manifest is current
        run: |
          . .venv/bin/activate
          python tools/update_manifest.py --check

  swift-core:
    runs-on: macos-latest
    steps:
      - name: Checkout repository without marketplace actions
        shell: bash
        run: |
          git init .
          git remote add origin "https://github.com/${GITHUB_REPOSITORY}.git"
          git fetch --depth=1 origin "${GITHUB_SHA}"
          git checkout --detach FETCH_HEAD
      - name: Swift version
        run: swift --version
      - name: Swift state-machine tests
        run: cd apps/ios && swift test
