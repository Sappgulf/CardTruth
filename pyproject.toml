[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "cardtruth"
version = "0.2.2"
description = "Local-first trading-card inspection, without invented grading probabilities"
requires-python = ">=3.11"
dependencies = ["numpy>=1.26,<3", "opencv-python-headless>=4.10,<5", "pydantic>=2.8,<3", "fastapi>=0.115,<1", "uvicorn>=0.30,<1", "pillow>=11.0,<13"]

[project.optional-dependencies]
dev = ["pytest>=8,<10", "httpx>=0.27,<1", "build>=1.2,<2"]

[project.scripts]
cardtruth = "cardtruth_core.cli:main"

[tool.setuptools.packages.find]
include = ["cardtruth_core*", "services*"]

[tool.setuptools.package-data]
cardtruth_core = ["profiles/*.json"]
"services.api" = ["static/*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
